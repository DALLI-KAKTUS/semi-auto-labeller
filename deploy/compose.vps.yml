# VPS'te mevcut `web-gateway` Caddy kullanılır. İkinci Caddy/host portu açılmaz:
# docker compose -f docker-compose.yml -f deploy/compose.vps.yml up -d --build
#
# Ağ yalıtımı (bir kez, elle):
#   docker network create --internal eng-pc12-edge   # yalnız Caddy <-> web
#   docker network create --internal eng-pc12-app    # yalnız web <-> Label Studio
#   docker network connect --alias eng-pc12-web eng-pc12-edge web-gateway
# web internete ve web-gateway'deki diğer servislere ulaşamaz.
services:
  web:
    networks: !override
      eng-pc12-edge:
        aliases: [eng-pc12-web]
      eng-pc12-app: {}
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
  label-studio:
    networks:
      default: {}
      eng-pc12-app:
        aliases: [label-studio]
      web-gateway:
        aliases: [eng-pc12-labelstudio]

networks:
  web-gateway:
    external: true
    name: web-gateway
  eng-pc12-edge:
    external: true
    name: eng-pc12-edge
  eng-pc12-app:
    external: true
    name: eng-pc12-app

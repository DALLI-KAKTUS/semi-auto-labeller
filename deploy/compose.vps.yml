# VPS'te mevcut `web-gateway` Caddy kullanılır. İkinci Caddy/host portu açılmaz:
# docker compose -f docker-compose.yml -f deploy/compose.vps.yml up -d --build
#
# Ağ yalıtımı (bir kez, elle):
#   docker network create --internal eng-pc12-edge   # yalnız Caddy <-> web ve Label Studio
#   docker network create --internal eng-pc12-app    # yalnız web <-> Label Studio
# Caddy'nin eng-pc12-edge bağlantısı /opt/web-gateway kurulumunda kalıcıdır.
# web ve Label Studio ortak web-gateway ağında değildir; diğer servisler onlara ulaşamaz.
# web internete çıkamaz; Label Studio yalnız kendi default ağı (postgres) üzerinden çıkabilir.
services:
  web:
    networks: !override
      eng-pc12-edge:
        aliases: [eng-pc12-web]
      eng-pc12-app: {}
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
  label-studio:
    networks:
      default: {}
      eng-pc12-app:
        aliases: [label-studio]
      eng-pc12-edge:
        aliases: [eng-pc12-labelstudio]

networks:
  eng-pc12-edge:
    external: true
    name: eng-pc12-edge
  eng-pc12-app:
    external: true
    name: eng-pc12-app

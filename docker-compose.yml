services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: labelstudio
      POSTGRES_USER: labelstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelstudio -d labelstudio"]
      interval: 10s
      timeout: 5s
      retries: 10

  label-studio:
    image: heartexlabs/label-studio:1.23.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DB: postgresql
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: labelstudio
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      LABEL_STUDIO_BASE_DATA_DIR: /label-studio/data
      LABEL_STUDIO_USERNAME: ${LS_ADMIN_EMAIL:?Set LS_ADMIN_EMAIL in .env}
      LABEL_STUDIO_PASSWORD: ${LS_ADMIN_PASSWORD:?Set LS_ADMIN_PASSWORD in .env}
      LABEL_STUDIO_USER_TOKEN: ${LS_API_KEY:?Set LS_API_KEY in .env}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      LABEL_STUDIO_HOST: https://${LABEL_STUDIO_DOMAIN:?Set LABEL_STUDIO_DOMAIN in .env}
      LABEL_STUDIO_CSRF_TRUSTED_ORIGINS: https://${LABEL_STUDIO_DOMAIN}
      LABEL_STUDIO_SESSION_COOKIE_SECURE: "1"
      LABEL_STUDIO_CSRF_COOKIE_SECURE: "1"
      UWSGI_PROCESSES: "2"
      SECRET_KEY: ${LS_SECRET_KEY:?Set LS_SECRET_KEY in .env}
    volumes:
      - lsdata:/label-studio/data
    expose:
      - "8000"
    command: ["label-studio-uwsgi"]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      label-studio:
        condition: service_started
    environment:
      ENG_DATA_DIR: /data
      ENG_PUBLIC_URL: https://${ENG_DOMAIN:?Set ENG_DOMAIN in .env}
      ENG_SECURE_COOKIES: "1"
      ENG_ADMIN_USERNAME: ${ENG_ADMIN_USERNAME:?Set ENG_ADMIN_USERNAME in .env}
      ENG_ADMIN_PASSWORD: ${ENG_ADMIN_PASSWORD:?Set ENG_ADMIN_PASSWORD in .env}
      LABEL_STUDIO_URL: http://label-studio:8000
      LABEL_STUDIO_PUBLIC_URL: https://${LABEL_STUDIO_DOMAIN}
      LABEL_STUDIO_API_KEY: ${LS_API_KEY}
      ENG_SERVER_RUNNER_TOKEN_FILE: /runner-key/token
    volumes:
      - webdata:/data
      - runnerkey:/runner-key
    expose:
      - "8000"

  # Sunucunun CPU'sunda çalışan çalıştırıcı (izinli kullanıcılar için, yavaş). Diğer konteynerler aç kalmasın diye
  # 2 çekirdek ve 3 GB RAM ile sınırlı, işlemci yarışında düşük öncelikli.
  server-runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runner
    restart: unless-stopped
    depends_on:
      - web
    environment:
      ENG_SERVER: http://web:8000
      ENG_RUNNER_TOKEN_FILE: /runner-key/token
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - runnerkey:/runner-key:ro
      - servermodels:/app/modeller
      - runnercache:/home/eng/.cache
    cpus: 2.0
    cpu_shares: 256
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256

  caddy:
    profiles: ["standalone"]
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    depends_on:
      - web
      - label-studio
    environment:
      ENG_DOMAIN: ${ENG_DOMAIN}
      LABEL_STUDIO_DOMAIN: ${LABEL_STUDIO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  lsdata:
  webdata:
  runnerkey:
  servermodels:
  runnercache:
  caddy_data:
  caddy_config:
